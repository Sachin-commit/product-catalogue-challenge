name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: Smoke test the stack (offline product source)
        run: |
          echo "PRODUCT_SOURCE=fakestore-snapshot" > backend/.env
          docker compose up -d --wait
          curl --fail --silent http://localhost:8080/health
          curl --fail --silent http://localhost:8080/api/v1/featured | grep -q '"products"'
          curl --fail --silent -X POST http://localhost:8080/api/v1/enquiries \
            -H 'Content-Type: application/json' \
            -d '{"productId":"3","name":"CI","email":"ci@example.com"}' | grep -q '"reference"'
          # The email must have reached the Mailpit inbox.
          curl --fail --silent http://localhost:8025/api/v1/messages | grep -q 'Enquiry ENQ-'
      - if: always()
        run: docker compose logs && docker compose down

  ios-architecture:
    name: iOS architecture rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce the Clean Architecture dependency rule
        run: ios/scripts/check-architecture.sh

  ios:
    name: iOS (build and test)
    runs-on: macos-15
    needs: ios-architecture
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app
      - name: Test
        working-directory: ios
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+( Pro)?' || echo "iPhone 16")
          xcodebuild test \
            -project Catalogue.xcodeproj \
            -scheme Catalogue \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO
